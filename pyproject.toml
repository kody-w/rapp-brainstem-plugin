[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rapp-brainstem-gateway"
version = "0.1.0"
description = "Authenticated remote MCP gateway for RAPP Brainstem"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Kody Wildfeuer" }]
dependencies = [
  "github-copilot-sdk==1.0.11",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "starlette>=0.48,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mcp==2.1.1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
rapp-brainstem-gateway = "rapp_brainstem_gateway.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rapp_brainstem_gateway", "agents"]

[tool.hatch.build.targets.wheel.force-include]
"soul.md" = "rapp_brainstem_gateway/soul.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# These files are verbatim, hash-pinned RAR packages, checked by sync_rar_agents.py.
extend-exclude = [
  "agents/basic_agent.py",
  "agents/context_memory_agent.py",
  "agents/manage_memory_agent.py",
  "agents/hacker_news_agent.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
